<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Transactions - SaveFlow</title>
        <link rel="stylesheet" href="style.css">
        <script src="https://unpkg.com/lucide@latest"></script>
    </head>
    <body class="bg-cover bg-center bg-fixed bg-[url('https://images.unsplash.com/photo-1549474753-43a7593c6f09?q=80&w=2940&auto=format&fit=crop')] text-gray-800">

    <div class="loading-screen" id="loadingScreen">
        <div class="loading-content">
            <div class="loading-spinner"></div>
            <h2>SaveFlow</h2>
            <p>Loading your transactions...</p>
        </div>
    </div>

    <nav>
        <div class="logo">
            <a href="index.html">
                <img src="Assets/mainlogobgremoved.png" alt="SaveFlow">
            </a>
        </div>
        <ul class="menu">
            <li>
                <a href="index.html">
                    <i data-lucide="house" aria-hidden="true"></i>
                    <span>Home</span>
                </a>
            </li>
            <li>
                <a href="transactions.html" class="active">
                    <i data-lucide="arrow-left-right" aria-hidden="true"></i>
                    <span>Transactions</span>
                </a>
            </li>
            <li>
                <a href="savings.html">
                    <i data-lucide="piggy-bank" aria-hidden="true"></i>
                    <span>Savings</span>
                </a>
            </li>
        </ul>
        <div class="account">
            <a href="#" class="account-link">
                <div class="account-icon">
                    <i data-lucide="user-round" aria-hidden="true"></i>
                </div>
                <div class="account-name">Account Name</div>
            </a>
        </div>
        <label for="currencySelect">Currency:</label>
        <select id="currencySelect">
            <option value="GBP">GBP (£)</option>
            <option value="USD">USD ($)</option>
            <option value="EUR">EUR (€)</option>
            <option value="AED">AED (د.إ)</option>
            <option value="CAD">CAD ($)</option>
            <option value="AUD">AUD ($)</option>
            <option value="INR">INR (₹)</option>
            <option value="NGN">NGN (₦)</option>
            <option value="JPY">JPY (¥)</option>
        </select>
    </nav>

    <main class="dashboard">

        <section class="welcome">
            <div>
                <h1>Transactions</h1>
                <p>Review your transaction history.</p>
                <a href="add-transaction.html" class="page-action-btn">+ Add Transaction</a>
            </div>
        </section>

        <!-- Section showing the list of all transactions -->
        <section class="card" id="transaction-list">
            <div class="list-header">
                <h2>All Transactions</h2>
                <span id="total-amount" class="total-badge">$0.00</span>
            </div>
            <ul id="transactions"></ul>
        </section>

    </main>

    <script src="script.js"></script>
    </body>
</html>
